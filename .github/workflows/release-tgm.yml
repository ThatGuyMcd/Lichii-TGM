name: Publish verified Lichii-tgm release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tested release tag with a draft and verified assets
        required: true
        type: string
      manual_release:
        description: Additional release explicitly requested by the owner
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tgm-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'ThatGuyMcd/Lichii-TGM'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check publication policy
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tools/release -p 'test_*.py'
      - name: Verify draft, tag, manifest and asset checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
          MANUAL_RELEASE: ${{ inputs.manual_release }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^Lichii-tgm-v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          gh release view "$TAG" --repo "$REPO" --json isDraft --jq '.isDraft' | grep -qx true
          ASSETS="$RUNNER_TEMP/release-assets"
          mkdir "$ASSETS"
          gh release download "$TAG" --repo "$REPO" --dir "$ASSETS"
          gh api --paginate "repos/$REPO/releases?per_page=100" | jq -s add > "$RUNNER_TEMP/releases.json"
          extra=()
          case "$MANUAL_RELEASE" in
            true) extra=(--manual) ;;
            false|'') ;;
            *) exit 1 ;;
          esac
          python3 tools/release/plan_nightly_release.py --releases "$RUNNER_TEMP/releases.json" \
            --journal "$RUNNER_TEMP/new-release-journal.json" --has-changes "${extra[@]}" --output "$RUNNER_TEMP/release-plan.json"
          test "$TAG" = "$(jq -r .tag "$RUNNER_TEMP/release-plan.json")"
          BASELINE=$(jq -r .previous_release "$RUNNER_TEMP/release-plan.json")
          python3 tools/release/publication_guard.py source --require-clean --baseline "$BASELINE" \
            --report "$RUNNER_TEMP/source-publication.json"
          python3 tools/release/verify_nightly_manifest.py --assets "$ASSETS" \
            --tag "$TAG" --source "$(git rev-parse HEAD)" > "$RUNNER_TEMP/appimage-offset"
          python3 tools/release/publication_guard.py zip \
            "$ASSETS/$TAG-windows-x86_64.zip" --report "$RUNNER_TEMP/windows-publication.json"
          command -v unsquashfs >/dev/null || { sudo apt-get update -qq; sudo apt-get install -y squashfs-tools; }
          unsquashfs -q -o "$(cat "$RUNNER_TEMP/appimage-offset")" \
            -d "$RUNNER_TEMP/linux-package" "$ASSETS/$TAG-linux-x86_64.AppImage"
          python3 tools/release/publication_guard.py tree "$RUNNER_TEMP/linux-package" \
            --report "$RUNNER_TEMP/linux-publication.json"
          SOURCE_COMMIT=$(git rev-parse HEAD) python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'linux-package'
          assets = pathlib.Path(os.environ['RUNNER_TEMP']) / 'release-assets'
          manifest = json.loads((assets / 'release-manifest.json').read_text())
          expected_kind = 'manual' if os.environ['MANUAL_RELEASE'] == 'true' else 'nightly'
          if manifest.get('release_kind', 'nightly') != expected_kind:
              raise SystemExit('Release kind does not match the authorised workflow request')
          info = json.loads((root / 'usr/share/lichii-tgm/build-info.json').read_text())
          if info['source_commit'] != os.environ['SOURCE_COMMIT'] or info['release_tag'] != os.environ['TAG']:
              raise SystemExit('Linux package identity mismatch')
          if not (root / 'usr/share/licenses/lichii-tgm/LICENSE.txt').is_file():
              raise SystemExit('Linux package license missing')
          PY
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          release_id=$(gh release view "$TAG" --repo "$REPO" --json databaseId --jq '.databaseId')
          gh api --method PATCH "repos/$REPO/releases/$release_id" \
            -F draft=false -F prerelease=false -f make_latest=true
